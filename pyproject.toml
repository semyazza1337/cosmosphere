[project]
name = "cosmosphere"
version = "0.1.0"
description = "Personal agentic astro-research digest — arxiv astro-ph.HE scored by Claude against your taste"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michal Kozuch", email = "michalkozuch2222@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "feedparser>=6.0.11",
    "pydantic>=2.9.0",
    "python-frontmatter>=1.1.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
openai = ["openai>=1.50.0"]
gemini = ["google-genai>=1.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]
all-providers = [
    "openai>=1.50.0",
    "google-genai>=1.0.0",
]

[project.scripts]
cosmosphere = "cosmosphere.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmosphere"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
